name: deploy-pages

# Publishes the static site (index.html + js/ + styles.css) to GitHub Pages.
# After this workflow runs once, enable Pages in repo settings:
#   Settings → Pages → Source: "GitHub Actions" (not branch deploy).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry before deploying
        run: node scripts/check-registry.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .  # whole repo — static site lives at the root

      - id: deployment
        uses: actions/deploy-pages@v4
